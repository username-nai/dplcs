{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3 mt-5">
        <div class="card border-danger shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Delete Book</h4>
            </div>
            <div class="card-body text-center p-5">
                <h5 class="card-title text-danger mb-4">Are you sure you want to delete this book?</h5>
                <p class="card-text mb-4">
                    <strong>{{ book.name }}</strong><br>
                    Total Quantity: {{ book.total_quantity }}<br>
                    Available Quantity: {{ book.available_quantity }}
                </p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'admin_find_book' %}" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete Book</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
