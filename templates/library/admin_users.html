{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-10 offset-md-1">
        <h3 class="mb-4">Registered Users</h3>
        
        <div class="card shadow-sm">
            <div class="card-body">
                {% if users %}
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Member ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for u in users %}
                                <tr>
                                    <td>{{ u.member_id }}</td>
                                    <td>{{ u.first_name }}</td>
                                    <td>{{ u.phone }}</td>
                                    <td>{{ u.email }}</td>
                                    <td>
                                        <a href="{% url 'admin_user_borrowed' u.id %}" class="btn btn-sm btn-info text-white">View Borrowed Books</a>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                {% else %}
                    <p class="text-muted">No users registered yet.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
